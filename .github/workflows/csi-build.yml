name: CSI Build and License
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Origin trial driver image to this repository GHCR
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: License Check
        run: |
          test -s LICENSE
          python3 - <<'PYCODE'
          from pathlib import Path
          files = [p for p in Path('.').rglob('*.go') if '.git' not in p.parts]
          missing = [str(p) for p in files if not any(marker in p.read_text() for marker in ('Licensed to the Apache Software Foundation', 'Licensed under the Apache License, Version 2.0'))]
          if missing:
              raise SystemExit('Missing Apache notices: ' + ', '.join(missing))
          print('All Go source Apache license notices present')
          PYCODE
      - run: go test ./...
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: csi-linux-amd64-${{ github.sha }}
          path: bin/
  image:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: driver
        with:
          context: .
          file: cmd/cloudstack-csi-driver/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:trial-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            LDFLAGS=-s -w -X github.com/ablecloud-team/ablestack-kubernetes-csi/pkg/driver.gitCommit=${{ github.sha }}
      - name: Image digest
        run: echo 'Driver digest ${{ steps.driver.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
